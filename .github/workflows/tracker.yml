name: MoreFit Capacity Tracker

on:
  # 支援外部準時排程 (如 cron-job.org 每 15 分鐘觸發一次) 或手動點擊執行
  workflow_dispatch:
    inputs:
      force:
        description: '忽略時段限制，立即強制抓取單筆紀錄並存檔（測試用）'
        required: false
        default: false
        type: boolean

  # GitHub 內建排程備援：
  # 1. 台灣時間 (UTC+8) 週一至週五 17:30 - 21:00 (對應 UTC 09:30 - 13:00)
  # 2. 台灣時間 (UTC+8) 週六至週日 08:00 - 21:00 (對應 UTC 00:00 - 13:00)
  # 每次喚醒後，fetch.py 會在該 15 分鐘區間內「每 3 分鐘抓取一筆」，結束後統一合併 commit & push
  schedule:
    - cron: '30,45 9 * * 1-5'
    - cron: '0,15,30,45 10-12 * * 1-5'
    - cron: '0 13 * * 1-5'
    - cron: '0,15,30,45 0-12 * * 0,6'
    - cron: '0 13 * * 0,6'

permissions:
  contents: write

concurrency:
  group: capacity-tracker-write
  cancel-in-progress: false

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch capacity every 3 mins (15-min batch)
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python3 fetch.py --force
          else
            python3 fetch.py
          fi

      - name: Commit and push batch data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/capacity_history.csv data/capacity_data.js
          if git diff --staged --quiet; then
            echo "本批次無新增資料需要提交。"
          else
            git commit -m "chore(data): record 15m capacity batch (3m interval)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
