name: MoreFit Capacity Tracker

on:
  # 當排程設定檔更新推送至 main 時，自動觸發註冊排程並立即抓一筆驗證
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tracker.yml'

  # 支援外部排程 (如 cron-job.org) 或手動點擊執行
  workflow_dispatch:
    inputs:
      force:
        description: '忽略時段限制，立即強制抓取單筆紀錄並存檔（測試用）'
        required: false
        default: false
        type: boolean

  # GitHub 內建自動排程（刻意採用 7,22,37,52 錯開全球整點 :00/:15 排隊塞車潮，並提早 8 分鐘預熱）：
  # 1. 平日晚間：台灣時間 17:22 預熱啟動，單一任務直接常駐執行至 21:00（期間每 15 分鐘自動推送數據）
  #    後續每 15 分鐘的排程作為斷線自動接力備援（若已有任務運行中會 1 秒自動略過）
  # 2. 週末全天：台灣時間 07:52 預熱啟動，分三段常駐無縫接力至 21:00
  schedule:
    - cron: '22,37,52 9 * * 1-5'
    - cron: '7,22,37,52 10-12 * * 1-5'
    - cron: '52 23 * * 5,6'
    - cron: '7,22,37,52 0-12 * * 0,6'

permissions:
  contents: write
  actions: read

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    steps:
      - name: Check if an active session is already running
        id: guard
        if: inputs.force != true && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ACTIVE_COUNT=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/tracker.yml/runs?status=in_progress" --jq '[.workflow_runs[] | select(.id != '"${GITHUB_RUN_ID}"')] | length')
          echo "Active running sessions (excluding self): ${ACTIVE_COUNT}"
          if [ "${ACTIVE_COUNT}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "已有常駐採集任務正在穩定運行中，本次備援喚醒自動略過。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Run continuous 3-min sampler with 15-min live Git sync
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ "${{ inputs.force }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            python3 fetch.py --force --git-sync
          else
            python3 fetch.py --git-sync
          fi
